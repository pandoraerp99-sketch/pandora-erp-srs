<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pandora · Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    /* Soft sky palette inspired by Kanto */
    --sky-1: #c5d4f0;
    --sky-2: #d8c5e8;
    --sky-3: #f0d4d4;
    --sky-4: #e8d8c5;

    --ink-0:  #0d1424;
    --ink-1:  #1f2a44;
    --ink-2:  #4a5570;
    --ink-3:  #7681a0;
    --ink-4:  #a8b0c5;

    --glass-bg:    rgba(255, 255, 255, 0.58);
    --glass-bg-2:  rgba(255, 255, 255, 0.72);
    --glass-border: rgba(255, 255, 255, 0.85);
    --glass-shadow: 0 1px 0 rgba(255,255,255,0.9) inset, 0 8px 32px rgba(54, 70, 120, 0.10), 0 2px 8px rgba(54, 70, 120, 0.06);

    --purple:    #6b5fff;
    --purple-2:  #9088ff;
    --purple-soft: rgba(107, 95, 255, 0.10);
    --blue:      #5b8cff;
    --blue-2:    #8eb0ff;
    --orange:    #f7984a;
    --orange-2:  #ffb87a;
    --green:     #34c77d;
    --pink:      #ee6a8e;
    --red:       #ef5d6a;
    --yellow:    #f4c948;

    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 20px;
    --r-xl: 26px;

    --font: 'Inter', ui-sans-serif, system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    color: var(--ink-0);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.011em;
    min-width: 1440px;
    background: #d8e0f0;
  }

  /* Cloud-sky background, fixed */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 90%, rgba(238, 200, 220, 0.55) 0%, transparent 60%),
      radial-gradient(ellipse 70% 60% at 85% 80%, rgba(240, 210, 180, 0.40) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 60% 30%, rgba(255, 255, 255, 0.6) 0%, transparent 50%),
      radial-gradient(ellipse 50% 40% at 15% 30%, rgba(195, 215, 245, 0.6) 0%, transparent 60%),
      linear-gradient(180deg, #b8c8e8 0%, #c8d4ea 25%, #e0d4e0 60%, #f0d8d2 100%);
  }
  /* soft cloud streaks */
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 400px 80px at 25% 65%, rgba(255,255,255,0.55) 0%, transparent 70%),
      radial-gradient(ellipse 500px 100px at 75% 75%, rgba(255,255,255,0.45) 0%, transparent 70%),
      radial-gradient(ellipse 300px 60px at 50% 40%, rgba(255,255,255,0.4) 0%, transparent 70%),
      radial-gradient(ellipse 350px 80px at 10% 85%, rgba(255,255,255,0.5) 0%, transparent 70%);
    pointer-events: none;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(13,20,36,0.15); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(13,20,36,0.25); }

  /* ====== Glass card ====== */
  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-lg);
    box-shadow: var(--glass-shadow);
    position: relative;
  }
  .glass-strong {
    background: var(--glass-bg-2);
    backdrop-filter: blur(32px) saturate(150%);
    -webkit-backdrop-filter: blur(32px) saturate(150%);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-lg);
    box-shadow: var(--glass-shadow);
  }

  .tnum { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); }

  /* ====== Sidebar ====== */
  .side {
    position: fixed; left: 16px; top: 16px; bottom: 16px;
    width: 210px;
    padding: 22px 14px 18px;
    display: flex; flex-direction: column;
    z-index: 10;
    border-radius: var(--r-lg);
  }
  .logo-row {
    display: flex; align-items: center; gap: 10px;
    padding: 0 8px 22px;
  }
  .logo-mark {
    width: 26px; height: 26px; position: relative; flex-shrink: 0;
  }
  .logo-mark svg { width: 100%; height: 100%; display: block; }
  .logo-text {
    font-size: 19px; font-weight: 700; letter-spacing: -0.025em;
    background: linear-gradient(135deg, #2a3454 0%, #4a5878 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 11px;
    border-radius: 12px;
    color: var(--ink-2);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 200ms cubic-bezier(.4,0,.2,1);
    position: relative;
  }
  .nav-item:hover { color: var(--ink-0); background: rgba(255,255,255,0.4); }
  .nav-item.active {
    background: rgba(255, 255, 255, 0.92);
    color: var(--ink-0);
    box-shadow: 0 1px 2px rgba(54,70,120,0.06), 0 4px 12px rgba(54,70,120,0.08);
  }
  .nav-item.active .nav-icon-box {
    background: var(--purple);
    color: #fff;
    box-shadow: 0 4px 10px rgba(107, 95, 255, 0.4);
  }
  .nav-icon-box {
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 7px;
    background: transparent;
    color: var(--ink-2);
    transition: all 200ms;
    flex-shrink: 0;
  }

  /* upgrade card */
  .upgrade {
    margin-top: auto;
    padding: 16px 14px;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0.55));
    border: 1px solid rgba(255,255,255,0.9);
    box-shadow: 0 4px 12px rgba(54,70,120,0.08);
  }
  .upgrade-title { font-size: 14px; font-weight: 600; color: var(--ink-0); margin-bottom: 6px; letter-spacing: -0.01em; }
  .upgrade-sub { font-size: 11.5px; color: var(--ink-3); line-height: 1.45; margin-bottom: 12px; }
  .btn-primary {
    width: 100%;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 12px;
    background: linear-gradient(135deg, var(--purple) 0%, var(--purple-2) 100%);
    color: #fff;
    font-weight: 500;
    font-size: 13px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(107,95,255,0.35), 0 1px 2px rgba(107,95,255,0.2);
    transition: transform 180ms, box-shadow 180ms;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(107,95,255,0.45); }

  /* ====== Topbar ====== */
  .topbar {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 18px;
    flex-wrap: nowrap;
  }
  .search {
    position: relative;
    flex: 1; min-width: 280px; max-width: 360px;
  }
  .search input {
    width: 100%;
    background: var(--glass-bg-2);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 11px 14px 11px 40px;
    color: var(--ink-0);
    font-size: 13px;
    font-family: var(--font);
    outline: none;
    transition: all 200ms;
    box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 2px 6px rgba(54,70,120,0.05);
  }
  .search input::placeholder { color: var(--ink-3); }
  .search input:focus { border-color: rgba(107,95,255,0.45); box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 0 0 4px rgba(107,95,255,0.10); }
  .search > svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
  .kbd {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 10px; padding: 3px 7px; border-radius: 5px;
    background: rgba(13,20,36,0.06); color: var(--ink-3);
    border: 1px solid rgba(13,20,36,0.06);
  }

  .seg {
    display: inline-flex;
    padding: 5px;
    background: var(--glass-bg-2);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
    box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 2px 6px rgba(54,70,120,0.05);
  }
  .seg-btn {
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--ink-2);
    cursor: pointer;
    transition: all 200ms cubic-bezier(.4,0,.2,1);
    font-weight: 500;
    white-space: nowrap;
  }
  .seg-btn.active {
    background: #0d1424;
    color: #fff;
    box-shadow: 0 4px 12px rgba(13,20,36,0.25);
  }
  .seg-btn:not(.active):hover { color: var(--ink-0); }

  .top-tools { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: auto; }
  .iconbtn {
    width: 40px; height: 40px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--glass-bg-2);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    color: var(--ink-1);
    cursor: pointer;
    transition: all 200ms;
    position: relative;
    box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 2px 6px rgba(54,70,120,0.05);
  }
  .iconbtn:hover { color: var(--ink-0); transform: translateY(-1px); }
  .iconbtn .ndot {
    position: absolute; top: 8px; right: 8px;
    min-width: 14px; height: 14px;
    border-radius: 999px;
    background: var(--pink);
    color: #fff;
    font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    padding: 0 3px;
    border: 2px solid rgba(255,255,255,0.9);
  }

  .user-chip {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 14px 5px 5px;
    background: var(--glass-bg-2);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 2px 6px rgba(54,70,120,0.05);
    cursor: pointer;
  }
  .avatar {
    width: 34px; height: 34px; border-radius: 999px;
    background: linear-gradient(135deg, var(--purple), var(--blue));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12.5px; font-weight: 600;
    overflow: hidden; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.85);
  }

  /* ====== Card heading ====== */
  .card-title {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .card-title h3 {
    margin: 0;
    font-size: 14.5px; font-weight: 600; color: var(--ink-0);
    letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 8px;
  }
  .more-btn {
    background: none; border: none; color: var(--ink-3);
    cursor: pointer; padding: 4px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 180ms;
  }
  .more-btn:hover { color: var(--ink-0); background: rgba(13,20,36,0.05); }

  /* delta */
  .delta {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1;
  }
  .delta.up   { background: rgba(52,199,125,0.14); color: #1a8e5a; }
  .delta.down { background: rgba(239,93,106,0.14); color: #c93545; }

  .upper-mini { font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--mono); font-weight: 500; }
  .label-sm { color: var(--ink-3); font-size: 12px; font-weight: 500; }

  /* dropdown chip */
  .dropdown-chip {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 16px;
    background: var(--glass-bg-2);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    font-size: 13px;
    color: var(--ink-1);
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 2px 6px rgba(54,70,120,0.05);
    transition: all 180ms;
    width: 100%;
    justify-content: space-between;
  }
  .dropdown-chip:hover { transform: translateY(-1px); }

  /* meeting row */
  .meeting-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0;
    border-top: 1px solid rgba(13,20,36,0.06);
  }
  .meeting-row:first-child { border-top: none; padding-top: 6px; }
  .meeting-row:last-child { padding-bottom: 0; }

  /* avatar stack */
  .ava-stack { display: flex; }
  .ava-stack .a {
    width: 30px; height: 30px; border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.92);
    margin-left: -8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; font-weight: 600;
    overflow: hidden;
  }
  .ava-stack .a:first-child { margin-left: 0; }

  /* mini button (round) */
  .quick-btn {
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 16px;
    padding: 18px 14px;
    text-align: left;
    cursor: pointer;
    display: flex; flex-direction: column; gap: 8px;
    transition: all 200ms;
    box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset;
  }
  .quick-btn:hover { transform: translateY(-2px); box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 8px 18px rgba(54,70,120,0.10); }
  .quick-icon {
    width: 38px; height: 38px;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-0);
  }

  /* AI chat */
  .chat-bubble {
    padding: 11px 14px;
    border-radius: 14px;
    font-size: 12.5px;
    line-height: 1.45;
    max-width: 80%;
  }
  .chat-bubble.bot { background: rgba(13,20,36,0.04); color: var(--ink-1); border-bottom-left-radius: 4px; }
  .chat-bubble.user { background: linear-gradient(135deg, var(--purple), var(--purple-2)); color: #fff; border-bottom-right-radius: 4px; }
  .chat-time { font-size: 10px; color: var(--ink-4); margin: 0 4px; }

  /* hero waving */
  .wave { display: inline-block; animation: wave 2.4s ease-in-out 1s 2; transform-origin: 70% 70%; }
  @keyframes wave {
    0%, 60%, 100% { transform: rotate(0); }
    10% { transform: rotate(14deg); }
    20% { transform: rotate(-8deg); }
    30% { transform: rotate(14deg); }
    40% { transform: rotate(-4deg); }
    50% { transform: rotate(10deg); }
  }

  /* === 3D tilt + sheen === */
  .tiltable {
    transform-style: preserve-3d;
    transition: transform 360ms cubic-bezier(.2,.7,.2,1), box-shadow 360ms;
    will-change: transform;
  }
  .tiltable .tilt-inner {
    transform: translateZ(20px);
    transform-style: preserve-3d;
  }
  .sheen {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    overflow: hidden;
    opacity: 0; transition: opacity 360ms;
  }
  .sheen::before {
    content: '';
    position: absolute;
    top: -50%; left: -30%;
    width: 60%; height: 200%;
    background: linear-gradient(115deg,
      transparent 30%,
      rgba(255,255,255,0.35) 50%,
      transparent 70%
    );
    transform: translateX(-200%);
    transition: transform 900ms cubic-bezier(.2,.7,.2,1);
  }
  .tiltable:hover .sheen { opacity: 1; }
  .tiltable:hover .sheen::before { transform: translateX(300%); }

  /* === Live pulse === */
  .live-dot {
    width: 8px; height: 8px; border-radius: 999px;
    background: #34c77d;
    position: relative;
    display: inline-block;
  }
  .live-dot::after {
    content: ''; position: absolute; inset: -4px;
    border-radius: 999px;
    background: #34c77d;
    opacity: 0.4;
    animation: liveRing 1.8s cubic-bezier(.2,.7,.2,1) infinite;
  }
  @keyframes liveRing {
    0% { transform: scale(0.8); opacity: 0.6; }
    100% { transform: scale(2.2); opacity: 0; }
  }

  /* === ring around avatar === */
  .avatar-ring {
    position: relative;
    padding: 2px;
    border-radius: 999px;
    background: conic-gradient(from 0deg, #6b5fff, #5b8cff, #34c77d, #f7984a, #ee6a8e, #6b5fff);
    animation: spinRing 6s linear infinite;
  }
  @keyframes spinRing { to { transform: rotate(360deg); } }
  .avatar-ring > * { animation: spinRing 6s linear infinite reverse; }

  /* === Chart reveal === */
  .draw-line {
    stroke-dasharray: 1500;
    stroke-dashoffset: 1500;
    animation: drawLine 1.6s cubic-bezier(.2,.7,.2,1) 200ms forwards;
  }
  @keyframes drawLine { to { stroke-dashoffset: 0; } }

  .reveal-area {
    clip-path: inset(0 100% 0 0);
    animation: revealArea 1.6s cubic-bezier(.2,.7,.2,1) 200ms forwards;
  }
  @keyframes revealArea { to { clip-path: inset(0 0 0 0); } }

  /* === Hero floating cards === */
  .float-card {
    position: absolute;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 14px;
    box-shadow: 0 12px 32px rgba(54,70,120,0.14), 0 4px 12px rgba(54,70,120,0.08);
    padding: 12px 14px;
    will-change: transform;
  }
  .float-1 { animation: floaty1 6s ease-in-out infinite; }
  .float-2 { animation: floaty2 7s ease-in-out infinite; animation-delay: -1.5s; }
  .float-3 { animation: floaty3 8s ease-in-out infinite; animation-delay: -3s; }
  @keyframes floaty1 { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(-2deg); } }
  @keyframes floaty2 { 0%,100% { transform: translateY(0) rotate(4deg); } 50% { transform: translateY(-14px) rotate(5deg); } }
  @keyframes floaty3 { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(-1deg); } }

  /* growing bar animation */
  .grow-bar {
    animation: growBar 1.2s cubic-bezier(.2,.7,.2,1) backwards;
    transform-origin: bottom;
  }
  @keyframes growBar {
    from { transform: scaleY(0); }
    to   { transform: scaleY(1); }
  }

  /* tooltip dynamic */
  .chart-tooltip {
    position: absolute;
    background: #0d1424;
    color: #fff;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 12px;
    pointer-events: none;
    box-shadow: 0 10px 24px rgba(13,20,36,0.3);
    transform: translate(-50%, -110%);
    opacity: 0;
    transition: opacity 180ms;
    white-space: nowrap;
    z-index: 5;
  }
  .chart-tooltip.show { opacity: 1; }
  .chart-tooltip::after {
    content: '';
    position: absolute;
    left: 50%; bottom: -5px;
    transform: translateX(-50%) rotate(45deg);
    width: 10px; height: 10px;
    background: #0d1424;
  }
  .chart-tooltip .row { display: flex; align-items: center; gap: 6px; }
  .chart-tooltip .row + .row { margin-top: 4px; }

  /* typing dots */
  .typing-dots {
    display: inline-flex; gap: 4px; padding: 4px 4px;
  }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 999px;
    background: var(--ink-2);
    animation: typeBounce 1.4s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typeBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* shimmer on counter */
  .counter-glow {
    background: linear-gradient(110deg, var(--ink-0) 30%, rgba(107,95,255,0.7) 50%, var(--ink-0) 70%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: counterShine 3s ease-in-out;
  }
  @keyframes counterShine {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }

  /* parallax bg layers */
  .sky-layer {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    transition: transform 400ms cubic-bezier(.2,.7,.2,1);
  }

  /* tooltip in chart */
  .tip {
    position: absolute;
    background: #0d1424; color: #fff;
    padding: 6px 10px; border-radius: 8px;
    font-size: 11.5px; font-weight: 500;
    pointer-events: none;
    box-shadow: 0 6px 16px rgba(13,20,36,0.25);
  }
  .tip::after {
    content: ''; position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%) rotate(45deg);
    width: 8px; height: 8px; background: #0d1424;
  }

  /* fade in animation */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeUp 600ms cubic-bezier(.2,.7,.2,1) backwards; }

  /* row enter */
  .stagger > * { animation: fadeUp 500ms cubic-bezier(.2,.7,.2,1) backwards; }
  .stagger > *:nth-child(1) { animation-delay: 40ms; }
  .stagger > *:nth-child(2) { animation-delay: 100ms; }
  .stagger > *:nth-child(3) { animation-delay: 160ms; }
  .stagger > *:nth-child(4) { animation-delay: 220ms; }
  .stagger > *:nth-child(5) { animation-delay: 280ms; }
  .stagger > *:nth-child(6) { animation-delay: 340ms; }

  #root { position: relative; z-index: 1; }

  /* divider */
  .hr-line { height: 1px; background: rgba(13,20,36,0.06); border: none; margin: 0; }

  /* transaction row */
  .tx-row {
    display: grid;
    grid-template-columns: 30px 1fr auto auto;
    align-items: center; gap: 14px;
    padding: 11px 0;
    border-top: 1px solid rgba(13,20,36,0.05);
    font-size: 13px;
  }
  .tx-row:first-child { border-top: none; }
  .tx-icon {
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 600;
  }

  /* invoice row */
  .inv-row {
    display: grid;
    grid-template-columns: 110px 1fr 40px 90px;
    align-items: center; gap: 14px;
    padding: 12px 0;
    border-top: 1px solid rgba(13,20,36,0.05);
    font-size: 13px;
  }
  .inv-row:first-child { border-top: none; padding-top: 4px; }
  .inv-bar { height: 8px; border-radius: 999px; background: rgba(13,20,36,0.05); overflow: hidden; }
  .inv-bar > div { height: 100%; border-radius: 999px; }

  /* footer */
  .turbine-art {
    position: absolute;
    top: -40px; right: 60px;
    width: 460px;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* Hero h1 */
  .hero-h1 {
    margin: 6px 0 0;
    font-size: 56px;
    line-height: 1.02;
    font-weight: 700;
    letter-spacing: -0.035em;
    color: var(--ink-0);
    max-width: 540px;
  }

</style>
</head>

  <script type="text/babel" src="charts.jsx"></script>
